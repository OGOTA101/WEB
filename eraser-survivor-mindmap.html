<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>消しゴムサバイバー｜芯のマインドマップ</title>
  <style>
    :root {
      --ink: #201a15;
      --muted: #766b60;
      --paper: #f6f0e4;
      --line: #d6cbbb;
      --blue: #dcecff;
      --yellow: #ffe39a;
      --purple: #eadcff;
      --green: #d9f0df;
      --red: #ce3328;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #181b1e;
      font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 62px;
      padding: 10px 18px;
      color: #fff;
      border-bottom: 2px solid #0c0e10;
      background: #22272b;
    }
    header h1 {
      margin: 0;
      font-size: clamp(16px, 2vw, 23px);
      letter-spacing: .04em;
    }
    header p { margin: 2px 0 0; color: #cfd8df; font-size: 12px; }
    .tools { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; }
    button {
      border: 2px solid #111;
      border-radius: 3px;
      padding: 7px 10px;
      color: var(--ink);
      background: #fff8e7;
      box-shadow: 2px 2px 0 #111;
      font: 800 12px/1.1 inherit;
      cursor: pointer;
    }
    button:hover { background: #fff; }
    button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #111; }
    main { min-height: 0; padding: 16px; }
    .board {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 4px solid #111;
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(191, 204, 214, .35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(191, 204, 214, .2) 1px, transparent 1px);
      background-size: 28px 28px;
      box-shadow: 7px 7px 0 #0d0f11;
    }
    .board::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-left: 3px solid rgba(204, 65, 65, .35);
      margin-left: 42px;
    }
    .board-title {
      position: absolute;
      left: 22px;
      top: 17px;
      z-index: 3;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      color: #2b72c9;
    }
    #links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .link { fill: none; stroke: #6f6153; stroke-width: 3; stroke-linecap: round; }
    .link.core { stroke: #221a13; stroke-width: 5; }
    .link.rogue { stroke: #9270ae; stroke-dasharray: 8 7; }
    .node {
      position: absolute;
      min-width: 126px;
      max-width: 230px;
      padding: 11px 14px 10px;
      border: 3px solid #241d17;
      border-radius: 5px;
      box-shadow: 4px 4px 0 rgba(36, 29, 23, .25);
      transform: translate(-50%, -50%);
      user-select: none;
      touch-action: none;
      cursor: grab;
      z-index: 2;
    }
    .node:active { cursor: grabbing; }
    .node.core { min-width: 210px; padding: 17px 18px 15px; text-align: center; }
    .node.core h2 { font-size: 25px; }
    .node h2 { margin: 0; font-size: 18px; line-height: 1.2; }
    .node p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; white-space: pre-line; }
    .node.core p { color: #3c3329; font-size: 13px; }
    .node.blue { background: var(--blue); }
    .node.yellow { background: var(--yellow); }
    .node.purple { background: var(--purple); }
    .node.green { background: var(--green); }
    .node.red { background: #f9d9d4; }
    .node .remove {
      position: absolute;
      top: 3px;
      right: 4px;
      display: none;
      border: 0;
      box-shadow: none;
      padding: 0 3px;
      background: transparent;
      color: #9b221d;
      font-size: 15px;
    }
    .node:hover .remove { display: block; }
    .legend {
      position: absolute;
      left: 20px;
      bottom: 15px;
      z-index: 3;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: #4b4035;
      font-size: 11px;
      font-weight: 800;
    }
    .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 4px; vertical-align: -1px; border: 1px solid #241d17; }
    .legend .core-key::before { background: var(--blue); }
    .legend .joy-key::before { background: var(--yellow); }
    .legend .outer-key::before { background: var(--purple); }
    .legend .rank-key::before { background: var(--green); }
    .hint { position: absolute; right: 20px; bottom: 15px; z-index: 3; color: #766b60; font-size: 11px; }
    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; padding: 10px 12px; }
      .tools { justify-content: flex-start; }
      main { padding: 9px; }
      .board-title { left: 14px; top: 12px; }
      .node { min-width: 102px; max-width: 158px; padding: 8px 9px; }
      .node.core { min-width: 154px; padding: 11px 10px; }
      .node.core h2 { font-size: 18px; }
      .node h2 { font-size: 14px; }
      .node p, .node.core p { font-size: 10px; }
      .legend { left: 12px; bottom: 10px; max-width: 70%; font-size: 9px; gap: 4px 8px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>消しゴムサバイバー｜芯のマインドマップ</h1>
        <p>中心：文房具 × 爽快感　／　ローグライクはランキングと結びつく</p>
      </div>
      <div class="tools" aria-label="編集ツール">
        <button id="add">＋ ノード追加</button>
        <button id="save">保存</button>
        <button id="reset">初期状態に戻す</button>
        <button id="export">SVG書き出し</button>
      </div>
    </header>
    <main>
      <section id="board" class="board" aria-label="編集可能なマインドマップ">
        <div class="board-title">ERASER SURVIVOR / CORE MAP</div>
        <svg id="links" aria-hidden="true"></svg>
        <div id="nodes"></div>
        <div class="legend">
          <span class="core-key">芯</span>
          <span class="joy-key">爽快感の要素</span>
          <span class="outer-key">外付け・挑戦</span>
          <span class="rank-key">評価・継続</span>
        </div>
        <div class="hint">ドラッグ：移動　／　ダブルクリック：編集</div>
      </section>
    </main>
  </div>
  <script>
    const STORAGE_KEY = 'eraser-survivor-mindmap-v1';
    const initialNodes = [
      { id:'stationery', x:35, y:43, w:220, kind:'blue core', title:'文房具', body:'消す / 書く / 道具' },
      { id:'joy', x:65, y:43, w:220, kind:'yellow core', title:'爽快感', body:'連射 / 撃破 / 演出' },
      { id:'hero', x:14, y:24, kind:'blue', title:'主人公', body:'消しゴム君\n頭突き / 弓ガード' },
      { id:'enemies', x:14, y:67, kind:'blue', title:'文字の敵', body:'兵 / 槍 / 弓 / 盾\n馬 / 龍 / 鉛筆ボス' },
      { id:'materials', x:30, y:83, kind:'blue', title:'収集', body:'消しカス\nアイテム / ライフ' },
      { id:'weapons', x:86, y:24, kind:'yellow', title:'攻撃', body:'通常弾 / 散弾 / 連射\nスナイパー / 大砲 / コンパス' },
      { id:'effects', x:86, y:67, kind:'yellow', title:'演出', body:'爆発 / 火花 / 軌道\nSE / BGM / ボス戦' },
      { id:'recovery', x:65, y:82, kind:'yellow', title:'全回収', body:'一回だけ\n経験値を一気に回収' },
      { id:'roguelike', x:51, y:88, kind:'purple', title:'ローグライク', body:'ランダム4択 / レベルアップ\n合成 / ビルド / リプレイ' },
      { id:'ranking', x:87, y:87, kind:'green', title:'ランキング', body:'スコア / 時間 / ライフ\n比較 / 継続動機' },
      { id:'web', x:14, y:88, kind:'red', title:'WEB版の挑戦', body:'軽量化 / スマホ操作\nFirebase / 音声制限' },
      { id:'gameLoop', x:50, y:18, kind:'red', title:'ゲームループ', body:'敵出現 → 強化 → 合成 → 生存' }
    ];
    const initialLinks = [
      ['stationery','hero'], ['stationery','enemies'], ['stationery','materials'],
      ['joy','weapons'], ['joy','effects'], ['joy','recovery'],
      ['gameLoop','stationery'], ['gameLoop','joy'],
      ['roguelike','ranking'], ['joy','roguelike'], ['roguelike','materials'],
      ['web','stationery'], ['web','roguelike'], ['roguelike','gameLoop']
    ];
    let nodes = load();
    let links = initialLinks.map(pair => pair.slice());
    let drag = null;

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(saved) && saved.length) return saved;
      } catch (_) {}
      return structuredClone(initialNodes);
    }
    function nodeById(id) { return nodes.find(node => node.id === id); }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function render() {
      const board = document.getElementById('board');
      const layer = document.getElementById('nodes');
      const svg = document.getElementById('links');
      layer.replaceChildren();
      svg.replaceChildren();
      const rect = board.getBoundingClientRect();
      for (const node of nodes) {
        const el = document.createElement('article');
        el.className = `node ${node.kind}`;
        el.dataset.id = node.id;
        el.style.left = `${node.x}%`;
        el.style.top = `${node.y}%`;
        if (node.w) el.style.width = `${node.w}px`;
        el.innerHTML = `<button class="remove" title="削除" aria-label="${escapeHtml(node.title)}を削除">×</button><h2>${escapeHtml(node.title)}</h2><p>${escapeHtml(node.body)}</p>`;
        el.addEventListener('pointerdown', onPointerDown);
        el.addEventListener('dblclick', onEdit);
        el.querySelector('.remove').addEventListener('pointerdown', event => event.stopPropagation());
        el.querySelector('.remove').addEventListener('click', () => removeNode(node.id));
        layer.appendChild(el);
      }
      for (const [fromId, toId] of links) {
        const from = nodeById(fromId); const to = nodeById(toId);
        if (!from || !to) continue;
        const fromEl = layer.querySelector(`[data-id="${fromId}"]`);
        const toEl = layer.querySelector(`[data-id="${toId}"]`);
        if (!fromEl || !toEl) continue;
        const a = anchorPoint(fromEl, rect); const b = anchorPoint(toEl, rect);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const curve = `M ${a.x} ${a.y} C ${(a.x+b.x)/2} ${a.y}, ${(a.x+b.x)/2} ${b.y}, ${b.x} ${b.y}`;
        path.setAttribute('d', curve);
        path.setAttribute('class', fromId === 'roguelike' && toId === 'ranking' ? 'link rogue' : (from.kind.includes('core') || to.kind.includes('core') ? 'link core' : 'link'));
        svg.appendChild(path);
      }
    }
    function anchorPoint(el, boardRect) {
      const r = el.getBoundingClientRect();
      const cx = r.left - boardRect.left + r.width / 2;
      const cy = r.top - boardRect.top + r.height / 2;
      return { x: cx, y: cy };
    }
    function onPointerDown(event) {
      if (event.target.closest('.remove')) return;
      const el = event.currentTarget;
      const board = document.getElementById('board').getBoundingClientRect();
      const node = nodeById(el.dataset.id);
      drag = { node, board, pointerId: event.pointerId };
      el.setPointerCapture(event.pointerId);
      event.preventDefault();
      el.addEventListener('pointermove', onPointerMove);
      el.addEventListener('pointerup', onPointerUp, { once: true });
      el.addEventListener('pointercancel', onPointerUp, { once: true });
    }
    function onPointerMove(event) {
      if (!drag) return;
      drag.node.x = clamp((event.clientX - drag.board.left) / drag.board.width * 100, 7, 93);
      drag.node.y = clamp((event.clientY - drag.board.top) / drag.board.height * 100, 9, 91);
      render();
    }
    function onPointerUp() { drag = null; render(); }
    function onEdit(event) {
      event.preventDefault();
      const node = nodeById(event.currentTarget.dataset.id);
      const title = prompt('ノード名', node.title);
      if (title === null) return;
      const body = prompt('補足（単語を改行で入力）', node.body);
      node.title = title.trim() || node.title;
      if (body !== null) node.body = body.trim();
      save(false); render();
    }
    function removeNode(id) {
      if (!confirm('このノードを削除しますか？')) return;
      nodes = nodes.filter(node => node.id !== id);
      links = links.filter(([from, to]) => from !== id && to !== id);
      save(false); render();
    }
    function save(showMessage = true) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(nodes));
      if (showMessage) flash('保存しました');
    }
    function flash(message) {
      const original = document.title;
      document.title = message;
      setTimeout(() => { document.title = original; }, 900);
    }
    function addNode() {
      const title = prompt('追加する単語', '新しい要素');
      if (!title) return;
      const body = prompt('補足（任意）', '') ?? '';
      const parentTitle = prompt('つなぐ先の単語（空欄なら単独）', '爽快感');
      const parent = nodes.find(node => node.title === parentTitle);
      const id = `custom-${Date.now()}`;
      nodes.push({ id, x: 50, y: 55, kind:'purple', title:title.trim(), body:body.trim() });
      if (parent) links.push([parent.id, id]);
      save(false); render();
    }
    function reset() {
      if (!confirm('編集内容を初期状態に戻しますか？')) return;
      nodes = structuredClone(initialNodes);
      links = initialLinks.map(pair => pair.slice());
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    }
    function exportSvg() {
      const board = document.getElementById('board');
      const width = board.clientWidth; const height = board.clientHeight;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml">${board.innerHTML}</div></foreignObject></svg>`;
      const url = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml' }));
      const a = document.createElement('a'); a.href = url; a.download = 'eraser-survivor-mindmap.svg'; a.click(); URL.revokeObjectURL(url);
    }
    document.getElementById('add').addEventListener('click', addNode);
    document.getElementById('save').addEventListener('click', () => save(true));
    document.getElementById('reset').addEventListener('click', reset);
    document.getElementById('export').addEventListener('click', exportSvg);
    window.addEventListener('resize', render);
    render();
  </script>
</body>
</html>
