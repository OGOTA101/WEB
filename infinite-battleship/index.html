<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>鋼海前線 - Infinite Battleship</title>
    <link rel="stylesheet" href="./style.css?v=20260426-layout2" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="top-hud">
        <div class="hud-row">
          <div class="hud-chip">
            <span>SCORE</span>
            <strong id="scoreText">000000</strong>
          </div>
          <div class="hud-chip money">
            <span>MONEY</span>
            <strong id="moneyText">+000000</strong>
          </div>
          <div class="hud-chip danger">
            <span>BOSS</span>
            <strong id="bossText">--:--</strong>
          </div>
          <div class="hud-chip">
            <span>CREW</span>
            <strong id="crewText">1/10</strong>
          </div>
        </div>
        <div class="meter-line">
          <div>
            <span id="distanceText">0.0km</span>
            <span id="seaLevelText">海域 Lv.1</span>
          </div>
          <div class="ship-hp">
            <span>SHIP</span>
            <div class="bar"><i id="shipHpBar"></i></div>
            <b id="shipHpText">100%</b>
          </div>
        </div>
      </header>

      <main class="game-layout">
        <aside class="ship-panel">
          <div class="panel-title">
            <span>座席移動</span>
            <button id="modeButton" class="tiny-button" type="button">ソロ</button>
          </div>
          <div id="seatMap" class="seat-map" aria-label="戦艦座席マップ"></div>
          <div class="part-list" id="partList"></div>
        </aside>

        <section class="play-panel">
          <canvas id="gameCanvas" width="390" height="720" aria-label="プレイ画面"></canvas>
          <div class="screen-vignette"></div>
          <div class="play-label">PLAY SCREEN</div>
          <div class="seat-status">
            <strong id="seatNameText">艦橋</strong>
            <span id="seatHelpText">移動と前方魚雷</span>
          </div>
          <div id="combatLog" class="combat-log"></div>
          <div id="controlPanel" class="control-panel"></div>
        </section>
      </main>

      <div id="upgradeModal" class="modal hidden">
        <div class="modal-card">
          <div class="modal-heading">
            <span>サルベージ強化</span>
            <b id="upgradeHint">5択から1つ選択</b>
          </div>
          <div id="upgradeOptions" class="upgrade-options"></div>
        </div>
      </div>

      <div id="startOverlay" class="start-overlay">
        <div class="start-card home-card">
          <div class="home-head">
            <div>
              <p class="kicker">縦画面協力戦艦アクション</p>
              <h1>鋼海前線</h1>
              <p class="lead">10個の席を移動しながら、無限に前進する戦艦を守り抜くブラウザ版です。</p>
            </div>
            <div class="wallet">
              <span>所持金</span>
              <strong id="profileMoneyText">0</strong>
            </div>
          </div>

          <nav class="home-tabs">
            <button class="tab-button active" data-tab="deploy" type="button">出撃</button>
            <button class="tab-button" data-tab="loadout" type="button">編成</button>
            <button class="tab-button" data-tab="gacha" type="button">ガチャ</button>
            <button class="tab-button" data-tab="records" type="button">記録</button>
          </nav>

          <section id="deployTab" class="home-tab active">
            <div class="start-actions">
              <button id="soloStartButton" type="button">ソロ出撃</button>
              <button id="quickStartButton" type="button">即開始</button>
            </div>
            <div class="room-tools">
              <button id="createRoomButton" type="button">ルーム作成</button>
              <div class="room-join">
                <input id="roomCodeInput" maxlength="6" placeholder="ROOM" />
                <button id="joinRoomButton" type="button">参加</button>
              </div>
            </div>
            <div class="loadout-strip" id="homeLoadoutStrip"></div>
          </section>

          <section id="loadoutTab" class="home-tab">
            <div class="section-row">
              <span id="loadoutSlotText">持ち込み 0/10</span>
              <button id="autoLoadoutButton" class="tiny-button" type="button">自動</button>
            </div>
            <div id="partInventory" class="inventory-list"></div>
          </section>

          <section id="gachaTab" class="home-tab">
            <div class="gacha-machine">
              <strong id="gachaResult">出撃スコアをお金にして初期強化を集めます</strong>
              <span>1回 100 MONEY</span>
            </div>
            <div class="start-actions">
              <button id="gachaButton" type="button">1回引く</button>
              <button id="grantMoneyButton" type="button">試作用+500</button>
            </div>
          </section>

          <section id="recordsTab" class="home-tab">
            <div id="recordList" class="result-grid"></div>
          </section>

          <div class="online-status" id="onlineStatus">Firebase接続準備中</div>
        </div>
      </div>

      <div id="lobbyOverlay" class="modal hidden">
        <div class="modal-card lobby-card">
          <div class="modal-heading">
            <span id="lobbyTitle">ルーム待機</span>
            <b id="lobbyCodeText">----</b>
          </div>
          <div id="lobbyPlayers" class="lobby-players"></div>
          <div class="loadout-summary">
            <span id="lobbyLoadoutText">持ち込み枠 10/10</span>
            <div id="lobbyLoadoutList" class="mini-loadout"></div>
          </div>
          <div class="start-actions">
            <button id="readyButton" type="button">参加OK</button>
            <button id="leaveRoomButton" type="button">退出</button>
          </div>
        </div>
      </div>

      <div id="resultOverlay" class="modal hidden">
        <div class="modal-card">
          <div class="modal-heading">
            <span>戦果報告</span>
            <b id="resultRank">MVP</b>
          </div>
          <div id="resultStats" class="result-grid"></div>
          <div class="start-actions">
            <button id="resultHomeButton" type="button">母港へ</button>
            <button id="resultRetryButton" type="button">再出撃</button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast hidden"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="./js/game.js?v=20260426-layout2"></script>
  </body>
</html>
